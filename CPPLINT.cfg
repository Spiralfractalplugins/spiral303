# Project-wide cpplint settings. The style follows the JUCE conventions of the
# repo; deviations from the Google baseline listed in --filter are deliberate
# (documented in the plan notes) and kept in one place.
linelength=140
filter=-legal,-readability/casting,-runtime/references,-whitespace/braces,-whitespace/tab,-whitespace/parens,-whitespace/comma,-whitespace/operators,-whitespace/newline,-build/header_guard,-build/include_order,-runtime/int,-whitespace/line_length,-whitespace/comments,-whitespace/indent,-build/c++11,-build/namespaces,-build/include_what_you_use,-readability/namespace,-readability/braces
